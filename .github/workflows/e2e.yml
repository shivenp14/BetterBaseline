name: E2E — Offline Baseline-Collapse Workflow

# Owned by Issue #78 (D2, @dersual).
# This workflow is intentionally isolated from ci.yml and integration.yml.
# It starts real local backend and frontend services with external internet
# access disabled (GitHub Actions has no outbound internet in this job by design
# plus Playwright route interception blocks any accidental external calls).

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "demo-data/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "demo-data/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.13"
  UV_VERSION: "0.9.26"
  NODE_VERSION: "24.15.0"
  BACKEND_PORT: "8001"
  FRONTEND_PORT: "3001"

jobs:
  e2e:
    name: E2E (Playwright, offline, Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Python / Backend ──
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      # ── Node / Frontend ──
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:${{ env.BACKEND_PORT }}"
        run: npm run build

      # ── E2E package ──
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: tests/e2e
        run: npx playwright install chromium --with-deps

      # ── Run E2E ──
      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          BACKEND_PORT: ${{ env.BACKEND_PORT }}
          FRONTEND_PORT: ${{ env.FRONTEND_PORT }}
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:${{ env.BACKEND_PORT }}"
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
