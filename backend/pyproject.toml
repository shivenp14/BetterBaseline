[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trialsync-backend"
version = "0.1.0"
description = "TrialSync local synthetic demo API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "psycopg[binary]==3.2.13", "httpx==0.28.1", "python-multipart==0.0.22"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
trialsync-api = "app.main:run"
trialsync-seed = "app.persistence.seed:main"
trialsync-worker = "app.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.persistence" = ["fixtures.json"]
